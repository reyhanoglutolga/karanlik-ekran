<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Karanlık Ekran"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Karanlık Ekran</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#000;color:#aaa;font-family:-apple-system,system-ui,sans-serif;overscroll-behavior:none}body{touch-action:none;user-select:none;-webkit-user-select:none}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000}.clock{text-align:center;opacity:1;transform:translate(0,0)}.time{font-size:clamp(54px,16vw,90px);font-weight:200;font-variant-numeric:tabular-nums;color:#e6e6e6}.date{font-size:15px;margin-top:4px;color:#bfc2c7}.notice{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 42px);font-size:12px;color:#555;text-align:center;padding:0 20px}.overlay{position:absolute;inset:0;touch-action:none;z-index:2}.progress{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);width:125px;height:4px;border-radius:4px;background:#222;z-index:3;overflow:hidden;pointer-events:none}.fill{height:100%;width:0;background:#777}.controls{display:none;position:absolute;z-index:4;inset:0;background:#080808;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:20px;text-align:center}.unlocked .controls{display:flex}.unlocked .overlay,.unlocked .progress{display:none}button{border:1px solid #444;background:#202020;color:#fff;border-radius:14px;padding:14px 22px;font-size:16px;max-width:90%}.status{font-size:13px;line-height:1.5;color:#aaa;max-width:320px}.small{font-size:12px;color:#777}.setting{width:min(330px,100%);padding:16px;border:1px solid #303030;border-radius:14px;background:#121212;text-align:left}.setting label{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:14px}.setting output{color:#fff;font-weight:650}.setting input{width:100%;accent-color:#9ca3af;touch-action:pan-x}.setting .small{margin:10px 0 0}</style></head><body><main class="screen" id="screen"><div class="clock" id="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div><div class="notice" id="notice">Kilidi açmak için 1 saniye basılı tut</div><div class="overlay" id="overlay" aria-label="Dokunma koruması"></div><div class="progress"><div class="fill" id="fill"></div></div><section class="controls" id="controls"><h2>Karanlık Ekran</h2><p class="status" id="wakeStatus">Ekran açık tutma durumu kontrol ediliyor.</p><button id="wakeBtn">Ekranı açık tutmayı dene</button><button id="lockBtn">🔒 Karanlık moda dön</button><p class="small">Sistem parlaklığını değiştirmez. iPhone'un kendi parlaklığını da düşür.</p></section></main><script>const $=id=>document.getElementById(id);let locked=true,holdStart=0,raf=0,wakeLock=null,holding=false;const holdSeconds=1;function tick(){const d=new Date();$('time').textContent=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});const m=d.getMinutes();$('clock').style.transform=`translate(${((m*13)%41-20)*.6}px,${((m*7)%41-20)*.6}px)`}tick();setInterval(tick,15000);function setLocked(v){locked=v;$('screen').classList.toggle('unlocked',!v);if(v)requestWakeLock()}function stopHold(){holding=false;cancelAnimationFrame(raf);$('fill').style.width='0'}function animate(){if(!holding)return;let p=Math.min((performance.now()-holdStart)/(holdSeconds*1000),1);$('fill').style.width=(p*100)+'%';if(p>=1){stopHold();setLocked(false);return}raf=requestAnimationFrame(animate)}$('overlay').addEventListener('pointerdown',e=>{if(!locked)return;e.preventDefault();holding=true;holdStart=performance.now();$('overlay').setPointerCapture(e.pointerId);animate()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('overlay').addEventListener(ev,stopHold));$('overlay').addEventListener('contextmenu',e=>e.preventDefault());$('lockBtn').addEventListener('click',()=>setLocked(true));async function requestWakeLock(){if(!('wakeLock'in navigator)){$('wakeStatus').textContent='Bu tarayıcıda ekranı açık tutma API desteği yok.';return}try{if(wakeLock&&!wakeLock.released){$('wakeStatus').textContent='Ekranı açık tutma isteği etkin.';return}wakeLock=await navigator.wakeLock.request('screen');$('wakeStatus').textContent='Ekranı açık tutma isteği etkin (iOS yine de iptal edebilir).';wakeLock.addEventListener('release',()=>{$('wakeStatus').textContent='Ekranı açık tutma isteği bırakıldı; yeniden deneyebilirsin.'})}catch(e){$('wakeStatus').textContent='Ekran açık tutma isteği kabul edilmedi: '+e.name}}$('wakeBtn').addEventListener('click',requestWakeLock);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
